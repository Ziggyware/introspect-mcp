name: .NET build

on:
  workflow_dispatch:
  push:
    branches: [arena/01a101df-introspect-mcp]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build original Windows-targeted service
        run: dotnet build introspectMCP.csproj --configuration Release -p:EnableWindowsTargeting=true
      - name: Bundle offline SDK and restored packages
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/offline"
          tar -czf "$RUNNER_TEMP/offline/dotnet-linux-x64.tar.gz" -C "$DOTNET_INSTALL_DIR" .
          if [ -d "$HOME/.nuget/packages" ]; then
            tar -czf "$RUNNER_TEMP/offline/nuget-packages.tar.gz" -C "$HOME/.nuget/packages" .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-dotnet-linux-x64
          path: ${{ runner.temp }}/offline/*.tar.gz
          retention-days: 3
          compression-level: 0
